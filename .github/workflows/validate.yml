# CI half of GitOps: every push/PR is linted and schema-validated BEFORE
# ArgoCD ever sees it on main. Red here = don't merge.
#
# Helm note: a chart's templates/ are NOT valid YAML — they are Go templates
# that happen to look like YAML ({{ .Values.foo }} is a syntax error to any
# YAML parser). So the raw-manifest jobs below must skip k8s/charts/, and the
# chart gets its own job that RENDERS it first and validates the output.
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            ignore: |
              k8s/charts/*/templates/
            rules:
              line-length: disable
              document-start: disable
              truthy: disable        # GitHub workflows' `on:` key trips it
              comments-indentation: disable

  kube-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # This ran as `uses: docker://ghcr.io/yannh/kubeconform` until the alert
      # rules landed, and it was broken from the moment the Helm chart was
      # added. A docker:// action's `args` go straight to the container's
      # entrypoint with NO shell in between, so the quotes in
      # `-ignore-filename-pattern 'k8s/charts/.*'` were passed through as
      # literal characters. The pattern became "'k8s/charts/.*'" — quotes and
      # all — which matches no path, so the exclusion silently did nothing and
      # kubeconform tried to parse the chart's Go templates as YAML.
      #
      # Running it as a normal `run:` step means a real shell strips the quotes.
      # Worth noting the shape: the argument LOOKED right in the diff, CI went
      # red for a reason unrelated to the commit that turned it red, and the
      # error pointed at the chart rather than at the flag.
      #
      # argocd/ + k8s/ only — bootstrap/cloud-init.yaml is not a k8s manifest.
      # -ignore-missing-schemas: ArgoCD Application CRDs have no upstream schema.
      # -ignore-filename-pattern: chart templates are unrendered Go templates;
      #   the helm-validate job below checks them after rendering.
      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            -ignore-filename-pattern 'k8s/charts/.*' \
            argocd k8s

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # `helm lint` catches chart-structural problems: malformed Chart.yaml,
      # templates that fail to render, values referenced but never defined.
      - name: helm lint
        run: helm lint k8s/charts/uptime-kuma

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # The step that actually matters. `helm lint` proves the chart is
      # well-formed; it does NOT prove the rendered output is valid Kubernetes.
      # Render with the same release name ArgoCD uses, then schema-check the
      # result — this is what the cluster will really receive.
      - name: helm template | kubeconform
        run: |
          helm template uptime-kuma k8s/charts/uptime-kuma \
            | kubeconform -strict -ignore-missing-schemas -summary -

  # kubeconform proves prometheus-rules is a well-formed ConfigMap. It does NOT
  # look inside the string, so a rule with broken PromQL passes every job above
  # and lands in the cluster — where Prometheus loads the config, skips the bad
  # group, and carries on looking healthy. The alerts in that group then simply
  # never fire, which is indistinguishable from nothing being wrong.
  #
  # This job extracts the rules and runs the real parser over them.
  promtool-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          VERSION=3.13.2   # keep in step with k8s/monitoring/prometheus/deployment.yaml
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin "prometheus-${VERSION}.linux-amd64/promtool"

      # The rendering is a committed script rather than a heredoc so it can be
      # run by hand before pushing — `python3 scripts/prometheus-ci-render.py
      # /tmp/prom` reproduces this job exactly. A CI-only heredoc is a check you
      # cannot rehearse, which is how a red pipeline becomes something to
      # squint at after the fact instead of before.
      - name: Render ConfigMaps to disk
        run: |
          pip install --quiet pyyaml
          python3 scripts/prometheus-ci-render.py /tmp/prom

      # The check that matters: real PromQL parsing of every alert expression.
      - name: promtool check rules
        run: promtool check rules /tmp/prom/rules/*.yml

      # And the other half — a scrape_config that no longer parses, a bad
      # relabel regex, or a rule_files glob matching nothing.
      - name: promtool check config
        run: promtool check config /tmp/prom/prometheus.yml

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive -diff
