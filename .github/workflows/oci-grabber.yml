name: oci-arm-grabber
# Temporary recovery workflow: retries launching the k3s node from its preserved
# boot volume until OCI frees up Always-Free ARM capacity in ap-mumbai-1.
# One run loops internally (attempt every 3 min for ~5h) so retries don't depend
# on GitHub's unreliable cron cadence; the schedule just restarts the loop.
# Remove this file once the node is back up.
on:
  schedule:
    - cron: '*/30 * * * *'   # restart the loop periodically (cron is best-effort)
  workflow_dispatch:          # manual "Run workflow" button
concurrency:
  group: oci-grabber
  cancel-in-progress: false   # don't stack loops; queue the newest
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli
      - name: Configure OCI auth
        env:
          OCI_KEY_PEM: ${{ secrets.OCI_KEY_PEM }}
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY_PEM" > ~/.oci/key.pem
          printf '%s\n' "$OCI_CONFIG"  > ~/.oci/config
          chmod 600 ~/.oci/key.pem ~/.oci/config
      - name: Retry launch until capacity (loops ~5h)
        run: |
          CID='ocid1.tenancy.oc1..aaaaaaaavd4nmrvlewa7vfglnz7rxkrcgkz6gdiaw44qk6yu4t6rc4vm6nzq'
          for i in $(seq 1 100); do
            COUNT=$(oci compute instance list --compartment-id "$CID" \
              --query "length(data[?\"display-name\"=='k3s-node-recovered' && \"lifecycle-state\"!='TERMINATED'])" \
              --raw-output 2>/dev/null)
            [ -z "$COUNT" ] && COUNT=0
            if [ "$COUNT" != "0" ]; then
              echo "::notice::k3s-node-recovered already exists (count=$COUNT) - done"; exit 0
            fi
            if oci compute instance launch \
                --availability-domain 'KSrE:AP-MUMBAI-1-AD-1' \
                --compartment-id "$CID" \
                --shape 'VM.Standard.A1.Flex' \
                --shape-config '{"ocpus":1,"memoryInGBs":6}' \
                --source-boot-volume-id 'ocid1.bootvolume.oc1.ap-mumbai-1.abrg6ljrajsuf35oxchrbtcs2ftolzfutc3aanlkghc5wpe5jwzbv3odw2kq' \
                --subnet-id 'ocid1.subnet.oc1.ap-mumbai-1.aaaaaaaaaos5mg55ymml257u5ueyg34dyp6pievbaukyez4j5ayn5luoufwa' \
                --assign-public-ip true \
                --display-name 'k3s-node-recovered' \
                --metadata '{"ssh_authorized_keys":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMujWLWAbdZfD5E0uDiHMSkUNRspUArHM+ZQ5bxfZDpN karthik-newlaptop-oci"}' \
                > /tmp/launch.out 2>&1; then
              echo "::notice::LAUNCH SUCCEEDED on attempt $i - instance is provisioning"; exit 0
            fi
            REASON=$(grep -oE '"code": "[^"]*"' /tmp/launch.out | head -1)
            echo "$(date -u +%H:%M:%S) attempt $i: no launch ($REASON) - sleep 180s"
            sleep 180
          done
          echo "::notice::5h window ended without capacity - schedule will restart the loop"
