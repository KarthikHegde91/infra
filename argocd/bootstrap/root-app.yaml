# Root "app of apps" — the ONE Application applied by hand, exactly once.
#
# ArgoCD watches k8s/apps/ in this repo; every file there is a child
# Application (monitoring, uptime-kuma, cloudflared). Add a file to
# k8s/apps/ and ArgoCD creates the app. Delete the file and the app is
# pruned. Everything else is `git push`.
#
# Bootstrap + adoption notes: see argocd/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Deleting the root app cascades cleanly instead of orphaning children.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # HTTPS, not SSH. This repo is PUBLIC, so ArgoCD reads it anonymously and
    # needs NO repo credential at all. Root and children are still on one
    # consistent URL — it is simply the URL that carries nothing that can
    # expire, be revoked, or go missing after a rebuild.
    #
    # This was git@github.com:... (f2ab158) only to keep the URLs consistent.
    # An SSH deploy key buys nothing on a public repo, and when it lapses every
    # sync stops silently: children sit in Unknown/ComparisonError while the
    # cluster quietly drifts from Git (see argocd/README.md).
    repoURL: https://github.com/KarthikHegde91/infra.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true # file removed from k8s/apps/ → child Application removed
      selfHeal: true # manual edits to child Applications revert to Git
    syncOptions:
      - CreateNamespace=true
