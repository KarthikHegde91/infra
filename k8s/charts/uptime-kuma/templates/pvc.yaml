{{/*
PersistentVolumeClaim — holds Uptime Kuma's SQLite database.

CRITICAL NAMING NOTE
The object name is pinned to "<fullname>-pvc" (→ "uptime-kuma-pvc") to match the
PVC that already exists in the cluster from the pre-Helm manifests.

Idiomatic Helm would name this just "<fullname>" (→ "uptime-kuma"). That single
character difference would be a DIFFERENT OBJECT: ArgoCD would create a new,
empty PVC and prune the old one, taking every monitor and all uptime history
with it. Adopting a running workload means matching existing names exactly.

A PVC's spec is also almost entirely immutable after creation — storageClassName
and accessModes cannot be changed, and size can only grow (and only if the
StorageClass allows expansion). These values therefore reproduce what is already
deployed rather than "improving" it.
*/}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "uptime-kuma.fullname" . }}-pvc
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "uptime-kuma.labels" . | nindent 4 }}
  annotations:
    # TWO annotations, because two different systems could delete this.
    #
    # 1. Helm's own policy — honoured by `helm uninstall`.
    helm.sh/resource-policy: keep
    #
    # 2. ArgoCD's policy — and this is the one that actually matters here.
    #    ArgoCD does NOT run `helm install`; it runs `helm template` and applies
    #    the rendered output itself. Helm's lifecycle features (hooks,
    #    resource-policy) are therefore never evaluated by Helm at all. Pruning
    #    is ArgoCD's decision, so it needs ArgoCD's annotation.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
