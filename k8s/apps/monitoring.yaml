# ArgoCD Application — Monitoring Stack
#
# This tells ArgoCD: "Watch the k8s/monitoring/ folder in the infra repo.
# Whenever those files change, automatically apply them to the cluster."
#
# This is GitOps — Git is the source of truth for what runs in K8s.
# You push changes to Git, ArgoCD deploys them. No manual kubectl needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:KarthikHegde91/infra.git
    targetRevision: main
    path: k8s/monitoring
    # ArgoCD's directory source is NON-recursive by default. This path holds
    # only namespace.yaml at its top level — grafana/, prometheus/ and
    # victoriametrics/ are subdirectories. Without recurse: true, ArgoCD syncs
    # the namespace and nothing else, and every manifest below is silently
    # unmanaged while the Application still reports Synced.
    #
    # That is what hid the Aug 2026 Grafana outage: 83f7055 (memory limit +
    # health probes) and 8367069 (node-exporter service discovery) both landed
    # in git and never reached the cluster, because both edit files inside
    # subdirectories. The one monitoring file ArgoCD ever did apply was
    # ssh-recovery-job.yaml — the only one at the top level.
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      # prune = true: if you DELETE a file from git, ArgoCD
      # deletes the corresponding resource from K8s
      selfHeal: true
      # selfHeal = true: if someone manually changes something
      # in K8s, ArgoCD reverts it to match Git
    syncOptions:
      - CreateNamespace=true
      # Automatically create the namespace if it doesn't exist
