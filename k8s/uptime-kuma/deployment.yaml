# Uptime Kuma — Self-hosted status page & uptime monitoring
#
# Uptime Kuma pings your websites/services every 60 seconds and
# records if they're up or down. It provides:
# - A public status page (like status.github.com)
# - Notifications when things go down (email, Slack, etc.)
# - Historical uptime graphs
#
# Accessible at status.karthikhegde.in through Cloudflare Tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  # Recreate strategy — stop old pod before starting new one
  # Required because Uptime Kuma uses SQLite (can't have 2 writers)
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:latest
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
