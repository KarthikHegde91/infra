# Prometheus configuration — What to scrape and where to send data
#
# scrape_configs: defines WHAT to monitor and HOW OFTEN
# remote_write: sends all scraped data to VictoriaMetrics for long-term storage
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      # How often Prometheus collects metrics from each target
      # 30s is a good balance between freshness and resource usage
      evaluation_interval: 30s
      # How often Prometheus evaluates alert rules

    # Alert rule definitions, mounted from the prometheus-rules ConfigMap
    # (rules.yaml in this directory) by deployment.yaml.
    #
    # evaluation_interval above was already set to 30s, and had been since this
    # file was written — but with no rule_files there was nothing to evaluate,
    # so the setting described an intention rather than a behaviour. That is the
    # cheapest possible version of this cluster's recurring failure: a config
    # that reads as if monitoring is configured while the mechanism is absent.
    #
    # The glob is intentional. Adding a rule file means dropping a key into the
    # ConfigMap; nothing in this file has to change.
    rule_files:
      - /etc/prometheus/rules/*.yml

    # NOTE: there is deliberately no `alerting:` block yet. Alertmanager is not
    # deployed, so rules that fire produce an ALERTS series (queryable in
    # Grafana, and remote_written to VictoriaMetrics like anything else) and
    # notify no one. Wiring delivery needs a channel to deliver to; see the
    # header of rules.yaml.

    # Send all metrics to VictoriaMetrics for long-term storage
    remote_write:
      - url: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/write
        # This uses K8s internal DNS to find VictoriaMetrics

    scrape_configs:
      # Monitor Prometheus itself
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Monitor host system via node_exporter — auto-discover the node's
      # current IP via the K8s API and scrape it on :9100, so this survives
      # instance relaunches (no hardcoded IP to go stale).
      - job_name: "node-exporter"
        scheme: http
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '([^:]+):.*'
            target_label: __address__
            replacement: '${1}:9100'

      # Monitor the kubelet on each node.
      #
      # role: node sets __address__ to <node-ip>:10250 — the kubelet API.
      # That endpoint is HTTPS and requires a bearer token. The previous
      # config specified neither, so every scrape failed against a plain-HTTP
      # request to an HTTPS port. Prometheus reports the job as DOWN; nothing
      # else surfaces it, so it looked healthy from Grafana.
      #
      # insecure_skip_verify is required because the kubelet serves a
      # self-signed cert whose SAN does not match the node IP we dial.
      - job_name: "kubernetes-nodes"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Per-container CPU / memory / network, served by cAdvisor which is
      # embedded in the kubelet but on a DIFFERENT path than the job above.
      # Without this job there are no container_* series at all, so every
      # per-pod resource panel stays empty no matter how healthy the cluster is.
      - job_name: "kubernetes-cadvisor"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Auto-discover and monitor K8s pods that expose metrics
      # Any pod with the annotation prometheus.io/scrape: "true"
      # will be automatically scraped
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Honour prometheus.io/path when set; Prometheus defaults to /metrics
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Rewrite the target's PORT while keeping its HOST.
          #
          # The previous rule sourced only the port annotation and replaced
          # __address__ wholesale with "${1}", so the target became the bare
          # string "9090" with no host — an invalid address. Both labels have
          # to be sourced together (joined by ";") and recombined, which is
          # what the regex below does: capture the host from __address__,
          # discard any existing :port, and append the annotated port.
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: "$1:$2"
            target_label: __address__
          # Carry pod labels and identity through onto the series
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
