# RBAC — Permissions for Prometheus to discover K8s resources
#
# Prometheus needs permission to query the Kubernetes API to
# discover which pods/nodes exist and should be monitored.
# Without this, kubernetes_sd_configs won't work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    # nodes/metrics is what authorises scraping the kubelet's /metrics and
    # /metrics/cadvisor endpoints directly. Without it the kubernetes-nodes
    # and kubernetes-cadvisor jobs authenticate fine but get 403 Forbidden.
    resources:
      ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
