# Prometheus — Metrics scraper
#
# Prometheus periodically "scrapes" (pulls) metrics from your services.
# Every 30 seconds, it visits each target and collects data like:
# - CPU usage, memory usage, disk I/O
# - HTTP request count, error rates, latency
#
# It stores metrics short-term and "remote writes" them to
# VictoriaMetrics for long-term storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  # Recreate, for the same reason as grafana/deployment.yaml but with sharper
  # consequences. The data volume is a ReadWriteOnce local-path PVC and
  # Prometheus holds an exclusive lock on the TSDB directory.
  #
  # At replicas: 1 the default RollingUpdate is actively wrong: maxUnavailable
  # 25% rounds DOWN to 0 and maxSurge 25% rounds UP to 1, so Kubernetes starts
  # the NEW pod and waits for it to go Ready before stopping the old one. Both
  # pods land on the same node, so RWO admits them both — there is no
  # Multi-Attach error to point at. The new process simply finds /prometheus
  # locked and exits, and the readinessProbe below guarantees it can never
  # satisfy maxUnavailable: 0. That is a permanent deadlock, not a slow
  # rollout: a CrashLoopBackOff pod beside a healthy old one, `rollout status`
  # hanging forever, and ArgoCD stuck Progressing while remote_write keeps
  # working — so nothing ever alerts.
  #
  # Recreate stops the old pod first and hands the lock over cleanly.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          # Pinned — full reasoning in grafana/deployment.yaml. A floating tag
          # makes the running version depend on restart timing rather than on
          # this repo, and TSDB format changes are forward-only: an unplanned
          # major jump cannot be undone by editing this line back.
          image: prom/prometheus:v3.13.2
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            # Keep local data for 7 days only (VictoriaMetrics has 6 months)
            - --web.enable-lifecycle
            # Allows config reload via HTTP POST to /-/reload
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # Nested inside the mount above, which is fine: kubelet sorts mount
            # paths so a parent is always mounted before its children. It has to
            # be a separate volume rather than another key in prometheus-config,
            # because a ConfigMap mount is flat — there is no way to project one
            # key into a subdirectory that the rule_files glob can match.
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          # Node is 3 OCPU / 18 GB (see terraform/variables.tf). These limits
          # bound this pod's growth; they are not rationing a scarce node.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              # No cpu limit — see the reasoning in grafana/deployment.yaml. A
              # CFS quota throttles scrapes and remote_write flushes into each
              # other, which shows up as gaps in the very metrics this pod
              # exists to collect.
          # Prometheus exposes two DIFFERENT health endpoints, and the split
          # matters: /-/healthy means "the process is alive", /-/ready means
          # "ready to serve queries". Using /-/healthy for liveness is what
          # stops a restart loop during a slow WAL replay — the process is
          # healthy the whole time, just not ready yet.
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            # 300s. Replaying the write-ahead log after an unclean shutdown is
            # the slow path, and on one core it is slower still.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 30
            timeoutSeconds: 5
            # Deliberately slack (150s) compared to Grafana's. This is a
            # storage engine: killing it mid-compaction costs more than
            # tolerating a slow reply, so liveness here is a last resort for a
            # genuinely wedged process, not a latency alarm.
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
