# TEMPORARY SSH-key recovery Job — REMOVE after use.
#
# Access to the node was lost (old SSH key gone after a laptop change; Run
# Command plugin absent; serial-console GRUB not reachable). This Job uses
# ArgoCD's cluster access to write a new authorized key onto the node via a
# hostPath mount, restoring SSH. Delete this file once you're back in so
# ArgoCD prunes it.
apiVersion: batch/v1
kind: Job
metadata:
  name: ssh-key-injector
  namespace: monitoring
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: injector
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMujWLWAbdZfD5E0uDiHMSkUNRspUArHM+ZQ5bxfZDpN karthik-newlaptop-oci'
              mkdir -p /host/.ssh
              touch /host/.ssh/authorized_keys
              grep -qxF "$KEY" /host/.ssh/authorized_keys || echo "$KEY" >> /host/.ssh/authorized_keys
              chown -R 1000:1000 /host/.ssh
              chmod 700 /host/.ssh
              chmod 600 /host/.ssh/authorized_keys
              echo "KEY INJECTED; authorized_keys now:"
              cat /host/.ssh/authorized_keys
          volumeMounts:
            - name: ubuntu-home
              mountPath: /host
      volumes:
        - name: ubuntu-home
          hostPath:
            path: /home/ubuntu
            type: Directory
