# Grafana — Dashboard UI for visualizing metrics
#
# Grafana reads data from VictoriaMetrics/Prometheus and displays
# it as graphs, charts, and alerts. It's the "pretty face" of monitoring.
# Accessible at grafana.karthikhegde.in through the Cloudflare Tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  # RWO volume can only attach to one pod at a time, so replace the old pod
  # before starting the new one (avoids a Multi-Attach wedge on rollout).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            # Allow anonymous read-only access for the public dashboard
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            # Set the root URL so Grafana knows its public address
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.karthikhegde.in"
            # Hide sign-out for cleaner anonymous experience
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "true"
            # Set home dashboard
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/node-exporter-full.json"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # 256Mi OOMKilled Grafana; 1Gi is safe on this 24GB node and
              # removes memory as a failure variable.
              memory: "1Gi"
              cpu: "500m"
          # Exercise Grafana's own health endpoint. Without probes a pod that
          # isn't actually serving still counts as a Service endpoint, so
          # cloudflared connects and hangs (the 20s timeout on the public URL).
          # startupProbe gives Grafana time to boot; readiness pulls a bad pod
          # out of the Service (fast 502, not a hang); liveness restarts a hang.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          hostPath:
            path: /opt/grafana/dashboards
            type: Directory
