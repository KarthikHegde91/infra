# VictoriaMetrics — Long-term metrics storage
#
# Think of VictoriaMetrics as a database optimized for time-series data
# (CPU usage at 10:00, at 10:01, at 10:02, etc.)
#
# Why VictoriaMetrics instead of just Prometheus?
# - Uses 7x less RAM than Prometheus for the same data
# - Supports 6+ month retention (Prometheus is ~2 weeks by default)
# - Accepts data FROM Prometheus via "remote write"
#
# Architecture: Prometheus scrapes metrics → writes to VictoriaMetrics → Grafana reads from VictoriaMetrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  replicas: 1
  # Recreate — see the full reasoning in prometheus/deployment.yaml. Same
  # shape: a ReadWriteOnce local-path PVC plus a single-writer lock, here the
  # flock VictoriaMetrics takes on --storageDataPath. At replicas: 1 the
  # default RollingUpdate starts the new pod first, it cannot take the lock,
  # and the rollout deadlocks permanently instead of failing loudly.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          # Pinned — full reasoning in grafana/deployment.yaml. This pod holds
          # the 6-month retention store (--retentionPeriod below) and
          # VictoriaMetrics migrates its on-disk format forward-only, so of the
          # three a surprise version jump here is the least recoverable.
          image: victoriametrics/victoria-metrics:v1.149.0
          imagePullPolicy: IfNotPresent
          args:
            - --storageDataPath=/victoria-metrics-data
            - --retentionPeriod=6
            # retentionPeriod=6 means keep data for 6 months
            - --httpListenAddr=:8428
          ports:
            - containerPort: 8428
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
          # VictoriaMetrics is frugal: this ingest rate (4 scrape jobs, 30s
          # interval, one node) sits well inside 384Mi. The node is
          # 3 OCPU / 18 GB (see terraform/variables.tf), so the tight limit is
          # a guardrail on this pod's growth rather than a rationing decision,
          # and the narrow request/limit spread keeps it off the top of the
          # eviction list.
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              # No cpu limit — see the reasoning in grafana/deployment.yaml.
          # VictoriaMetrics exposes a single /health endpoint (unlike Prometheus
          # it has no separate ready/healthy split), so all three probes share
          # it and the thresholds carry the distinction instead.
          #
          # Readiness matters more here than it looks: Prometheus remote_writes
          # into this pod. If VM stops serving, readiness pulls it from the
          # Service and Prometheus buffers to its WAL and retries — data is
          # delayed, not lost. Without a readiness probe those writes would hang
          # against a dead endpoint, the same failure that took Grafana down.
          startupProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 10
            timeoutSeconds: 5
            # 300s — opening 6 months of storage on a cold start is not instant.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 30
            timeoutSeconds: 5
            # Slack (150s) on purpose — this pod holds the 6-month retention.
            # A restart during a background merge is a worse outcome than a
            # slow health reply, so liveness only catches a truly wedged
            # process.
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriametrics-pvc
