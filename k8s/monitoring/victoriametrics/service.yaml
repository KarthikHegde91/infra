# Service — Makes VictoriaMetrics reachable by other pods
#
# In Kubernetes, pods can't talk to each other directly by name.
# A Service creates a stable internal DNS name:
# "victoriametrics.monitoring.svc.cluster.local" on port 8428
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  selector:
    app: victoriametrics
  ports:
    - port: 8428
      targetPort: 8428
